{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Blog{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>
<body>
    <header class="site-header">
        <h1>Mi Blog</h1>
        <nav class="site-nav">
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'acerca' %}">Acerca de mí</a>
            <a href="{% url 'lista_posts' %}">Lista de Posts</a>
            <a href="{% url 'contacto' %}">Contacto</a>
            <a href="{% url 'crear_post' %}">Crear Post</a>
            <span class="nav-right">
                {% if user.is_authenticated %}
                    Bienvenido, {{ user.username }}!
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit">Cerrar sesión</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Iniciar sesión</a>
                {% endif %}
            </span>
        </nav>
    </header>
    <main class="site-main">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="site-footer">
        <p>Creado con Django</p>
    </footer>
</body>
</html>
