{% extends "posts/base.html" %}

{% block title %}Post eliminado | Mi Blog{% endblock %}

{% block content %}
    <h2>¿Estás seguro de que deseas eliminar este post?</h2>
    <p>Estás a punto de eliminar el post: <strong>"{{ post.titulo }}"</strong>. Esta acción no se puede deshacer.</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white;">Sí, eliminar</button>
        <button type="button" onclick="window.location.href='{% url 'detalle_post' post.slug %}'">Cancelar</button>
    </form>
{% endblock %}
